<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4e54" />
      <stop offset="50%" stop-color="#2c2f33" />
      <stop offset="100%" stop-color="#151719" />
    </linearGradient>

    <linearGradient id="bumper-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="10%" stop-color="#222" />
      <stop offset="90%" stop-color="#222" />
      <stop offset="100%" stop-color="#111" />
    </linearGradient>

    <radialGradient id="lidar-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#333" />
      <stop offset="70%" stop-color="#111" />
      <stop offset="100%" stop-color="#000" />
    </radialGradient>

    <linearGradient id="dustbin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222" />
      <stop offset="100%" stop-color="#111" />
    </linearGradient>
  </defs>
<g transform="rotate(180 200 200)">
  <g style="display:none">
    <path d="M 50 180 L 50 80 A 30 30 0 0 1 80 50 L 320 50 A 30 30 0 0 1 350 80 L 350 180 A 150 150 0 0 1 50 180 Z"
          fill="#000" opacity="0.5"/>
  </g>

  <g id="robot-body">
    <path d="M 50 180 L 50 80 A 30 30 0 0 1 80 50 L 320 50 A 30 30 0 0 1 350 80 L 350 180 A 150 150 0 0 1 50 180 Z"
          fill="url(#body-grad)" stroke="#555" stroke-width="2"/>

    <!-- Bumper follows body corners but stays straight across -->
    <path d="M 50 90 L 50 80 A 30 30 0 0 1 80 50 L 320 50 A 30 30 0 0 1 350 80 L 350 90 Z"
          fill="url(#bumper-grad)"/>

    <!-- Straight lower bumper edge -->
    <line x1="50" y1="90" x2="350" y2="90" stroke="#111" stroke-width="3"/>
  </g>

  <g id="lidar">
    <circle cx="200" cy="285" r="34.66" fill="#222" stroke="#444" stroke-width="2"/>
    <circle cx="200" cy="285" r="30" fill="url(#lidar-grad)"/>
    <circle cx="200" cy="285" r="12" fill="#000" stroke="#111" stroke-width="4"/>
  </g>

  <g id="dustbin">
    <path d="M 120 120 L 280 120 L 270 180 C 270 200 230 210 200 210 C 170 210 130 200 130 180 Z"
          fill="url(#dustbin-grad)" stroke="#3a3e42" stroke-width="2"
          transform="translate(200 165) scale(1.5) translate(-200 -160)"/>
  </g>
</g>
</svg>
